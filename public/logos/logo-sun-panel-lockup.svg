<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="GS Solar">
  <defs>
    <linearGradient id="spl-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC730"/>
      <stop offset="1" stop-color="#F5B301"/>
    </linearGradient>
    <linearGradient id="spl-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532D"/>
      <stop offset="1" stop-color="#0B3320"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(0,0)">
    <g fill="#F5B301">
      <rect x="45" y="3" width="6" height="9" rx="3"/>
      <rect x="45" y="3" width="6" height="9" rx="3" transform="rotate(45 48 30)"/>
      <rect x="45" y="3" width="6" height="9" rx="3" transform="rotate(90 48 30)"/>
      <rect x="45" y="3" width="6" height="9" rx="3" transform="rotate(135 48 30)"/>
      <rect x="45" y="3" width="6" height="9" rx="3" transform="rotate(180 48 30)"/>
      <rect x="45" y="3" width="6" height="9" rx="3" transform="rotate(225 48 30)"/>
      <rect x="45" y="3" width="6" height="9" rx="3" transform="rotate(270 48 30)"/>
      <rect x="45" y="3" width="6" height="9" rx="3" transform="rotate(315 48 30)"/>
    </g>
    <circle cx="48" cy="30" r="15" fill="url(#spl-sun)"/>
    <path d="M24 58 L72 58 L84 86 L12 86 Z" fill="url(#spl-panel)"/>
    <g stroke="#FAF9F5" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
      <line x1="40" y1="58" x2="34.5" y2="86"/>
      <line x1="56" y1="58" x2="61.5" y2="86"/>
      <line x1="24" y1="72" x2="84" y2="72"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="108" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="0.5" fill="#14532D">GS <tspan fill="#0B3320">Solar</tspan></text>
  <text x="110" y="74" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11.5" letter-spacing="4.5" fill="#8A8A82">ENERGY SYSTEMS</text>
</svg>
